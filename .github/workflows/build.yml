name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 同一分支只保留最新一次构建，避免连续提交时排队运行旧版本。
concurrency:
  group: electronic-schedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run schedule tests
        run: dotnet test tests/ElectronicSchedule.Tests/ElectronicSchedule.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish ElectronicSchedule.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: 电子课表-测试版-win-x64
          path: |
            bin/Release/net8.0-windows/win-x64/publish/电子课表.exe
            bin/Release/net8.0-windows/win-x64/publish/schedule.json
